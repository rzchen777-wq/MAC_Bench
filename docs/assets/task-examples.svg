<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title description">
<title id="title">MAC-Bench: interconnected tasks, shared environments, outcome evaluation</title>
<desc id="description">A preschool task links admissions, places and family inductions. A software task links metadata and source selection to wheels and source archives. Agent systems choose how to coordinate these components, interact with real applications or a code workspace, and are evaluated on final outcomes.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#637690"/></marker>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #1b2c43; }
    .heading { font-size: 22px; font-weight: 700; }
    .body { font-size: 19px; }
    .label { font-size: 18px; font-weight: 600; }
    .muted { fill: #52657d; font-size: 18px; }
    .edge { fill: none; stroke: #637690; stroke-width: 2.3; marker-end: url(#arrow); }
  </style>
</defs>
<rect width="1120" height="650" rx="18" fill="#ffffff"/>
<rect x="1" y="1" width="1118" height="648" rx="17" fill="none" stroke="#dce3ed"/>
<rect x="24" y="24" width="1072" height="74" rx="12" fill="#182f50"/>
<text x="44" y="56" style="fill:#ffffff;font-size:24px;font-weight:700">One objective. Interconnected work. Your agent system.</text>
<text x="44" y="82" style="fill:#d6e3f7;font-size:18px">Choose the agents, divide the work, and coordinate their actions in a shared environment.</text>
