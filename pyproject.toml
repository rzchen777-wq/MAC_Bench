[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-bench"
version = "1.0.0"
description = "MAC-Bench: multi-agent collaboration tasks and evaluation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6",
    "huggingface_hub>=1.0,<2",
    "python-dotenv>=1",
    "Pillow>=10",
    "jsonschema>=4.21",
    "graphql-core>=3.2,<3.3",
    "openapi-schema-validator>=0.6,<0.7",
]

[project.urls]
Repository = "https://github.com/rzchen777-wq/MAC_Bench"
Documentation = "https://github.com/rzchen777-wq/MAC_Bench/blob/main/docs/getting-started.md"
Dataset = "https://huggingface.co/datasets/sihuichuibuqi/MAC-Bench"
Issues = "https://github.com/rzchen777-wq/MAC_Bench/issues"

[project.optional-dependencies]
agents = ["litellm>=1.0", "orjson>=3.9", "tqdm>=4.66", "numpy>=1.26", "fastapi>=0.110"]
tool-api = ["mcp>=1.12,<2", "uvicorn>=0.30", "fastapi>=0.110"]
modal = ["modal[api-proxy-support]>=1.5"]
meta_team = ["aiohttp>=3.9", "duckduckgo-search>=6", "docker>=7"]
aorchestra = ["pydantic>=2,<3", "openai>=1"]
magentic_one = ["autogen-core==0.7.5", "autogen-agentchat==0.7.5", "autogen-ext==0.7.5", "markitdown==0.1.3"]
dev = ["pytest>=8", "pyarrow>=14"]

[project.scripts]
mac-bench = "mac_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mac_bench*"]
exclude = ["artifacts*", "collaboration*", "third_party*", "runs*", "evolution*", "shared*", "tests*", "build*", ".*"]

[tool.setuptools.package-data]
"mac_bench.environments.packaging" = ["*.txt", "*.md"]
"*" = ["prompts/*.txt", "prompts/*.json", "prompts/*/*.txt", "prompts/*/*.json", "README.txt", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_policy = "failed"
markers = ["baselines: native baseline integration using pinned external dependencies"]
